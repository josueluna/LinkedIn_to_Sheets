<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn to Sheets - Changelog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FAVICON -->
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/main/public/logo.png">

  <!-- MARKDOWN PARSER -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Roboto, Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #dadce0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
      font-weight: 500;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #5f6368;
    }

    hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 25px 0;
    }

    /* BOTONES */
    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 6px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
      cursor: pointer;
    }

    .btn:hover {
      background: #1558b0;
    }

    /* MARKDOWN STYLES */
    #changelog-content h1,
    #changelog-content h2,
    #changelog-content h3 {
      margin-top: 20px;
      color: #202124;
    }

    #changelog-content p {
      margin-bottom: 10px;
    }

    #changelog-content ul {
      padding-left: 18px;
      color: #5f6368;
    }

    #changelog-content li {
      margin-bottom: 6px;
    }

    #changelog-content code {
      background: #f6f8fc;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 13px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9aa0a6;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <img 
        src="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/main/public/logo.png" 
        class="logo"
      >
      <h1>LinkedIn to Sheets</h1>
    </div>
    <hr>

    <!-- CHANGELOG CONTENT -->
    <div id="changelog-content">
      Loading changelog...
    </div>

    <hr>

    <!-- NAV BUTTONS -->
    <div class="buttons">
      <a class="btn" href="https://josueluna.github.io/LinkedIn_to_Sheets/wiki.html">
        Documentation
      </a>
      <a class="btn" href="https://josueluna.github.io/LinkedIn_to_Sheets/privacy.html">
        Privacy Policy
      </a>
      <a class="btn" href="https://forms.gle/xmCiUB8Tzs3ocM616" target="_blank">
        Contact Support
      </a>
    </div>

    <div class="footer">
      © LinkedIn to Sheets
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    fetch("https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/refs/heads/develop/CHANGELOG.md")
      .then(response => response.text())
      .then(markdown => {
        document.getElementById("changelog-content").innerHTML = marked.parse(markdown);
      })
      .catch(error => {
        document.getElementById("changelog-content").innerHTML = "Error loading changelog.";
        console.error(error);
      });
  </script>

</body>
</html>
