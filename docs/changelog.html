<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn to Sheets — Changelog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Every update, fix and improvement to LinkedIn to Sheets — documented." />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/main/public/logo.png">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --radius: 0.875rem;
      --background: oklch(0.995 0.002 255);
      --foreground: oklch(0.18 0.025 265);
      --card: oklch(1 0 0);
      --muted-fg: oklch(0.50 0.02 260);
      --primary: oklch(0.66 0.19 145);
      --primary-fg: oklch(0.99 0.005 145);
      --primary-glow: oklch(0.74 0.19 145);
      --linkedin: oklch(0.50 0.15 245);
      --border: oklch(0.92 0.008 255);
      --shadow-glow: 0 10px 30px -10px oklch(0.66 0.19 145 / 0.35);
      --shadow-elegant: 0 24px 60px -28px oklch(0.30 0.05 265 / 0.25);
      --shadow-soft: 0 1px 2px oklch(0.30 0.05 265 / 0.04), 0 8px 24px -12px oklch(0.30 0.05 265 / 0.10);
      --glass-bg: color-mix(in oklab, white 65%, transparent);
      --glass-strong-bg: color-mix(in oklab, white 78%, transparent);
      --glass-border: color-mix(in oklab, oklch(0.30 0.05 265) 8%, transparent);
      --gradient-brand: linear-gradient(135deg, oklch(0.50 0.15 245), oklch(0.66 0.19 145));
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.16 0.025 265);
        --foreground: oklch(0.96 0.005 255);
        --card: oklch(0.21 0.028 265);
        --muted-fg: oklch(0.72 0.02 260);
        --primary: oklch(0.74 0.19 145);
        --primary-fg: oklch(0.16 0.025 265);
        --primary-glow: oklch(0.82 0.18 145);
        --linkedin: oklch(0.70 0.15 245);
        --border: oklch(1 0 0 / 0.10);
        --shadow-glow: 0 10px 30px -10px oklch(0.74 0.19 145 / 0.45);
        --shadow-elegant: 0 24px 60px -28px oklch(0 0 0 / 0.55);
        --shadow-soft: 0 1px 2px oklch(0 0 0 / 0.30), 0 8px 24px -12px oklch(0 0 0 / 0.45);
        --glass-bg: color-mix(in oklab, oklch(0.21 0.028 265) 55%, transparent);
        --glass-strong-bg: color-mix(in oklab, oklch(0.21 0.028 265) 75%, transparent);
        --glass-border: color-mix(in oklab, white 10%, transparent);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }
    html, body { background: var(--background); color: var(--foreground); }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.5; min-height: 100vh;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button, a { cursor: pointer; }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border: 1px solid var(--glass-border);
    }

    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease-out, transform .7s ease-out; will-change: opacity, transform; }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }

    /* ── Nav (matches landing) ── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: .875rem 1.5rem; max-width: 72rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: .625rem; font-weight: 600; letter-spacing: -0.01em; }
    .brand img { width: 2rem; height: 2rem; border-radius: .375rem; }
    .nav-links { display: none; gap: 2rem; font-size: .875rem; color: var(--muted-fg); }
    .nav-links a { transition: color .2s; }
    .nav-links a:hover { color: var(--foreground); }
    @media (min-width: 768px) { .nav-links { display: flex; align-items: center; } }

    .btn-primary {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--primary); color: var(--primary-fg);
      padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; font-weight: 500;
      box-shadow: var(--shadow-glow); border: none;
      transition: transform .25s, filter .25s, box-shadow .25s;
    }
    .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 14px 36px -12px oklch(0.66 0.19 145 / 0.45); transform: translateY(-1px); }

    .btn-glass {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; font-weight: 500;
      color: var(--foreground); transition: transform .25s, box-shadow .25s;
      background: var(--glass-bg);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border: 1px solid var(--glass-border);
    }
    .btn-glass:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }

    .icon { width: 1rem; height: 1rem; flex-shrink: 0; }
    .icon-sm { width: .875rem; height: .875rem; flex-shrink: 0; }

    /* ── Hero (orbs like landing) ── */
    .hero {
      position: relative; overflow: hidden;
      padding: 5rem 1.5rem 4rem; text-align: center;
    }
    
    .hero,
    .page-hero {
      position: relative;
      isolation: isolate;
    }

    @media (min-width: 768px) { .hero { padding: 7rem 1.5rem 6rem; } }
    .hero-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .orb { position: absolute; border-radius: 9999px; filter: blur(64px); }
    .orb-1 { top: -8rem; left: -6rem; width: 480px; height: 480px; background: radial-gradient(closest-side, oklch(0.66 0.19 145 / 0.22), transparent 70%); }
    .orb-2 { top: -5rem; right: -10%; width: 520px; height: 520px; background: radial-gradient(closest-side, oklch(0.50 0.15 245 / 0.20), transparent 70%); }
    .hero-inner { max-width: 48rem; margin: 0 auto; }

    .eyebrow { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.22em; color: var(--primary); }
    .beta-pill { display: none; }
    .dot-wrap, .dot-ping, .dot { display: none; }
    .page-title { margin-top: .75rem; font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; text-wrap: balance; }
    .page-title .gradient-text {
      background: var(--gradient-brand);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    @media (min-width: 768px) { .page-title { font-size: 3.75rem; } }
    .page-sub { margin-top: 1.5rem; color: var(--muted-fg); font-size: 1rem; max-width: 36rem; margin-left: auto; margin-right: auto; text-wrap: balance; }
    @media (min-width: 768px) { .page-sub { font-size: 1.125rem; } }
    .page-actions { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }

    /* ── Content card ── */
    .content-wrap { max-width: 52rem; margin: 0 auto; padding: 0 1.5rem 6rem; }
    .content-card {
      border-radius: 1.25rem;
      background: var(--glass-strong-bg);
      backdrop-filter: saturate(160%) blur(20px);
      -webkit-backdrop-filter: saturate(160%) blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-elegant);
      padding: 2.5rem 2rem;
    }
    @media (min-width: 768px) { .content-card { padding: 3rem 3rem; } }

    /* ── Per-version stack ── */
    .versions { display: flex; flex-direction: column; gap: 1.5rem; }
    @media (min-width: 768px) { .versions { gap: 2rem; } }

    .version-card {
      position: relative;
      border-radius: 1.25rem;
      background: var(--glass-strong-bg);
      backdrop-filter: saturate(160%) blur(20px);
      -webkit-backdrop-filter: saturate(160%) blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-elegant);
      padding: 1.75rem 1.5rem;
      overflow: hidden;
    }
    @media (min-width: 768px) { .version-card { padding: 2.25rem 2.5rem; } }

    /* Brand accent stripe on the left edge */
    .version-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--gradient-brand);
      opacity: .85;
    }

    .version-head {
      display: flex; align-items: center; gap: .625rem;
      margin-bottom: 1rem;
      padding-bottom: .875rem;
      border-bottom: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
    }
    .version-badge {
      display: inline-flex; align-items: center; gap: .375rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8125rem; font-weight: 600; letter-spacing: -0.01em;
      color: var(--primary-fg);
      background: var(--gradient-brand);
      padding: .3rem .625rem; border-radius: .5rem;
      box-shadow: var(--shadow-glow);
    }
    .version-badge::before {
      content: ""; width: 6px; height: 6px; border-radius: 9999px;
      background: var(--primary-fg);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary-fg) 30%, transparent);
    }
    .version-latest {
      font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--primary);
      padding: .25rem .5rem; border-radius: 9999px;
      background: color-mix(in oklab, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent);
    }

    /* Markdown */
    #changelog-content { color: var(--foreground); }
    #changelog-content h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.015em; margin-top: 2.5rem; margin-bottom: .5rem; }
    #changelog-content h1:first-child { margin-top: 0; }
    #changelog-content h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; margin-top: 2rem; margin-bottom: .5rem; }
    #changelog-content h3 { font-size: 1.05rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: .4rem; }
    #changelog-content p { font-size: .9375rem; line-height: 1.75; color: var(--muted-fg); margin-bottom: .875rem; }
    #changelog-content ul, #changelog-content ol { padding-left: 1.25rem; color: var(--muted-fg); margin: .5rem 0 1.25rem; }
    #changelog-content ul { list-style: disc; }
    #changelog-content ol { list-style: decimal; }
    #changelog-content li { margin-bottom: .375rem; line-height: 1.65; font-size: .9375rem; }
    #changelog-content code {
      background: color-mix(in oklab, var(--primary) 8%, transparent);
      color: var(--foreground);
      padding: 2px 7px; border-radius: 6px; font-size: .8125rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #changelog-content pre {
      background: color-mix(in oklab, var(--foreground) 4%, transparent);
      border: 1px solid var(--border);
      border-radius: .5rem; padding: 1rem 1.25rem;
      overflow-x: auto; margin-bottom: 1.25rem;
    }
    #changelog-content pre code { background: none; padding: 0; font-size: .8125rem; }
    #changelog-content a { color: var(--linkedin); font-weight: 500; }
    #changelog-content a:hover { text-decoration: underline; }
    #changelog-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    #changelog-content blockquote {
      border-left: 3px solid var(--primary);
      padding: .25rem 0 .25rem 1rem; margin: 1rem 0;
      color: var(--muted-fg);
    }

    .loading {
      text-align: center; color: var(--muted-fg);
      padding: 3rem 0; font-size: .9375rem;
    }

    /* Footer (matches landing) */
    .footer {
      border-top: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
      padding: 2.5rem 0;
    }
    .footer-inner {
      max-width: 72rem; margin: 0 auto; padding: 0 1.5rem;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      gap: 1rem; font-size: .875rem; color: var(--muted-fg);
    }
    @media (min-width: 768px) { .footer-inner { flex-direction: row; } }
    .footer-brand { display: flex; align-items: center; gap: .625rem; color: var(--foreground); font-weight: 500; }
    .footer-brand img { width: 1.25rem; height: 1.25rem; border-radius: .25rem; }
    .footer a.link { color: var(--foreground); transition: color .2s; }
    .footer a.link:hover { color: var(--primary); }
    .footer .gh { display: inline-flex; align-items: center; gap: .5rem; transition: color .2s; }
    .footer .gh:hover { color: var(--foreground); }
    

/* ───────────────────────────────────────────────────────────
   Modern polish: animated gradient mesh + micro-interactions
   Additive only — safe to drop into any of the three pages.
   ─────────────────────────────────────────────────────────── */

/* Animated gradient mesh background — sits behind everything */
.bg-mesh {
  position: fixed; inset: 0; z-index: -10; pointer-events: none; overflow: hidden;
}
.bg-mesh::before,
.bg-mesh::after,
.bg-mesh > .blob {
  content: ""; position: absolute; border-radius: 9999px;
  filter: blur(90px); opacity: .55; will-change: transform;
}
.bg-mesh::before {
  width: 46vw; height: 46vw; top: -10vw; left: -8vw;
  background: radial-gradient(closest-side, oklch(0.66 0.19 145 / 0.35), transparent 70%);
  animation: meshDriftA 22s ease-in-out infinite alternate;
}
.bg-mesh::after {
  width: 50vw; height: 50vw; top: 20vh; right: -12vw;
  background: radial-gradient(closest-side, oklch(0.50 0.15 245 / 0.32), transparent 70%);
  animation: meshDriftB 26s ease-in-out infinite alternate;
}
.bg-mesh > .blob {
  width: 42vw; height: 42vw; bottom: -14vw; left: 25vw;
  background: radial-gradient(closest-side, oklch(0.74 0.19 145 / 0.28), transparent 70%);
  animation: meshDriftC 30s ease-in-out infinite alternate;
}
@media (prefers-color-scheme: dark) {
  .bg-mesh::before { opacity: .45; background: radial-gradient(closest-side, oklch(0.74 0.19 145 / 0.40), transparent 70%); }
  .bg-mesh::after  { opacity: .42; background: radial-gradient(closest-side, oklch(0.60 0.18 245 / 0.42), transparent 70%); }
  .bg-mesh > .blob { opacity: .38; background: radial-gradient(closest-side, oklch(0.78 0.18 145 / 0.34), transparent 70%); }
}
@keyframes meshDriftA {
  0%   { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(6vw, 4vh, 0) scale(1.15); }
}
@keyframes meshDriftB {
  0%   { transform: translate3d(0,0,0) scale(1.05); }
  100% { transform: translate3d(-7vw, -3vh, 0) scale(1); }
}
@keyframes meshDriftC {
  0%   { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-4vw, -6vh, 0) scale(1.12); }
}
@media (prefers-reduced-motion: reduce) {
  .bg-mesh::before, .bg-mesh::after, .bg-mesh > .blob { animation: none; }
}

/* Subtle grain so the gradient never looks flat (very faint) */
.bg-mesh::before { mix-blend-mode: normal; }

/* ── Micro-interactions ─────────────────────────────────── */

/* Animated underline for nav links */
.nav-links a {
  position: relative;
  padding-bottom: 2px;
}
.nav-links a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 2px; border-radius: 2px;
  background: var(--gradient-brand, linear-gradient(90deg, var(--linkedin), var(--primary)));
  transform: scaleX(0); transform-origin: right center;
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
}
.nav-links a:hover::after { transform: scaleX(1); transform-origin: left center; }

/* Button shimmer on hover (primary) */
.btn-primary { position: relative; overflow: hidden; isolation: isolate; }
.btn-primary::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, color-mix(in oklab, white 35%, transparent) 50%, transparent 70%);
  transform: translateX(-120%); transition: transform .7s cubic-bezier(.2,.7,.2,1);
  pointer-events: none;
}
.btn-primary:hover::before { transform: translateX(120%); }

/* Glass button: gentle border glow on hover */
.btn-glass { transition: transform .25s, box-shadow .35s, border-color .35s; }
.btn-glass:hover {
  border-color: color-mix(in oklab, var(--primary) 45%, transparent);
  box-shadow: 0 10px 30px -14px oklch(0.66 0.19 145 / 0.35);
}

/* Brand mark: tiny pop on hover */
.brand { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.brand:hover { transform: translateY(-1px); }
.brand img { transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s; }
.brand:hover img { transform: rotate(-4deg) scale(1.06); box-shadow: 0 6px 18px -8px oklch(0.66 0.19 145 / 0.55); }

/* Icon chips / card icons: bounce + glow on card hover */
.icon-chip, .step-icon, .card-icon {
  transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
}
.lift:hover .icon-chip,
.lift:hover .card-icon,
.step:hover .step-icon,
.privacy-card:hover .card-icon {
  transform: translateY(-2px) scale(1.06);
  box-shadow: 0 8px 24px -10px color-mix(in oklab, var(--primary) 50%, transparent);
}

/* Footer GitHub link: subtle slide */
.footer .gh svg { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.footer .gh:hover svg { transform: rotate(-8deg) scale(1.1); }

/* Slightly richer card hover for content card / cta-band / version cards */
.content-card, .cta-band, .version-card {
  transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s, border-color .5s;
}
.content-card:hover, .cta-band:hover {
  transform: translateY(-2px);
}
.version-card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in oklab, var(--primary) 30%, transparent);
  box-shadow: 0 30px 70px -28px oklch(0.30 0.05 265 / 0.30), 0 0 0 1px color-mix(in oklab, var(--primary) 18%, transparent);
}

/* Make sure interactive layers stay above the mesh */
.nav, .hero, .page-hero, main, .content-wrap, .footer, section { position: relative; z-index: 1; }

/* Fade superior para mejorar legibilidad del hero */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40vh;

  background: linear-gradient(
    to bottom,
    var(--background) 0%,
    transparent 100%
  );

  z-index: -5;
  pointer-events: none;
}

</style>
</head>

    </a>

</footer>

<script>
  // Reveal-on-scroll
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    if (!('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    els.forEach(function (el) { io.observe(el); });
  })();

  // Load changelog from GitHub and split into per-version glass panels
  (function () {
    var url = 'https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/develop/CHANGELOG.md';
    var target = document.getElementById('changelog-content');

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
      });
    }

    function observeReveals(scope) {
      var els = scope.querySelectorAll('.reveal');
      if (!els.length) return;
      if (!('IntersectionObserver' in window)) {
        els.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
      els.forEach(function (el) { io.observe(el); });
    }

    function renderVersions(md) {
      // Match each "## vX.Y.Z" heading and capture its body up to the next version heading (or EOF).
      // Horizontal-rule separators (---) between versions are stripped.
      var versionRe = /^[ \t]*##[ \t]+(v\d[\w.\-+]*)[ \t]*\r?\n([\s\S]*?)(?=^[ \t]*##[ \t]+v\d|\Z)/gmi;
      var matches = [];
      var m;
      // JS doesn't support \Z; emulate by appending sentinel
      var src = md + '\n## v0.0.0-__end__\n';
      while ((m = versionRe.exec(src)) !== null) {
        if (m[1] === 'v0.0.0-__end__') break;
        matches.push({ version: m[1], body: m[2] });
      }

      if (!matches.length) {
        // Fallback: render the whole markdown in one card so we never lose content.
        target.innerHTML =
        '<div class="content-card reveal">' +
        '<div class="markdown-body">' + marked.parse(md) + '</div>' +
        '</div>';
        observeReveals(target);
        return;
      }

      var html = '<div class="versions">';
      matches.forEach(function (entry, i) {
        // Strip leading/trailing horizontal rules and whitespace from the body.
        var body = entry.body
        .replace(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/gm, '')
        .trim();
        var rendered = marked.parse(body);
        var latest = i === 0
        ? '<span class="version-latest">Latest</span>'
        : '';
        html +=
        '<article class="version-card reveal" style="transition-delay:' + Math.min(i * 60, 240) + 'ms;">' +
        '<header class="version-head">' +
        '<span class="version-badge">' + escapeHtml(entry.version) + '</span>' +
        latest +
        '</header>' +
        '<div class="markdown-body">' + rendered + '</div>' +
        '</article>';
      });
      html += '</div>';
      target.innerHTML = html;
      observeReveals(target);
    }

    fetch(url)
    .then(function (r) { if (!r.ok) throw new Error('Not found'); return r.text(); })
    .then(renderVersions)
    .catch(function () {
      target.innerHTML =
      '<div class="content-card reveal">' +
      '<p style="text-align:center;color:var(--muted-fg);">Couldn\'t load the changelog right now. Try again later or visit the <a href="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/develop/CHANGELOG.md?plain=1" target="_blank" rel="noopener" style="color:var(--linkedin);">repository</a>.</p>' +
      '</div>';
      observeReveals(target);
    });
  })();
</script>
</body>
</html>
