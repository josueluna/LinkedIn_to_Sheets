<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn to Sheets — Changelog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/main/public/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
:root{
  --background:oklch(0.995 0.002 255);
  --foreground:oklch(0.18 0.025 265);
  --muted-foreground:oklch(0.50 0.02 260);
  --primary:oklch(0.66 0.19 145);
  --primary-glow:oklch(0.74 0.19 145);
  --linkedin:oklch(0.50 0.15 245);
  --border:oklch(0.92 0.008 255);
  --card:oklch(1 0 0);
  --gradient-hero:radial-gradient(ellipse at top left,oklch(0.66 0.19 145/0.12),transparent 55%),radial-gradient(ellipse at top right,oklch(0.50 0.15 245/0.12),transparent 55%);
  --gradient-primary:linear-gradient(135deg,oklch(0.66 0.19 145),oklch(0.74 0.19 145));
  --shadow-elegant:0 24px 60px -28px oklch(0.30 0.05 265/0.25);
  --shadow-soft:0 1px 2px oklch(0.30 0.05 265/0.04),0 8px 24px -12px oklch(0.30 0.05 265/0.10);
  --shadow-glow:0 10px 30px -10px oklch(0.66 0.19 145/0.35);
  --glass-bg:color-mix(in oklab,white 65%,transparent);
  --glass-border:color-mix(in oklab,oklch(0.30 0.05 265) 8%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--background);
  background-image:var(--gradient-hero);
  background-attachment:fixed;
  color:var(--foreground);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:60px 20px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.container{
  max-width:820px;
  width:100%;
  background:var(--glass-bg);
  backdrop-filter:saturate(160%) blur(20px);
  -webkit-backdrop-filter:saturate(160%) blur(20px);
  border:1px solid var(--glass-border);
  padding:48px;
  border-radius:1.375rem;
  box-shadow:var(--shadow-elegant),var(--shadow-soft);
}
.header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.logo{width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow-soft)}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;color:var(--foreground)}
h2{margin-top:30px;font-size:18px;font-weight:600;letter-spacing:-0.01em;color:var(--foreground)}
p{font-size:15px;line-height:1.7;color:var(--muted-foreground);margin:0 0 14px}
.highlight{color:var(--foreground);font-weight:600}
hr{border:none;border-top:1px solid var(--border);margin:28px 0}
.buttons{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.btn,.email{
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px 20px;border-radius:0.75rem;
  background:var(--gradient-primary);color:white;text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-0.005em;
  border:1px solid transparent;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s cubic-bezier(.2,.7,.2,1);
  box-shadow:var(--shadow-soft);
}
.btn:hover,.email:hover{transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.btn.secondary{
  background:white;color:var(--foreground);
  border:1px solid var(--border);
}
.btn.secondary:hover{box-shadow:var(--shadow-soft)}
.contact{margin-top:32px;padding-top:22px;border-top:1px solid var(--border)}
.footer{margin-top:32px;font-size:12px;color:var(--muted-foreground);text-align:center;opacity:.8}
/* Markdown */
#changelog-content h1,#changelog-content h2,#changelog-content h3{
  margin-top:26px;margin-bottom:10px;color:var(--foreground);font-weight:600;letter-spacing:-0.01em;
}
#changelog-content h1{font-size:22px}
#changelog-content h2{font-size:18px}
#changelog-content h3{font-size:16px}
#changelog-content p{margin-bottom:12px}
#changelog-content ul{padding-left:20px;color:var(--muted-foreground);margin:8px 0 16px}
#changelog-content li{margin-bottom:6px;line-height:1.65}
#changelog-content code{
  background:color-mix(in oklab,oklch(0.66 0.19 145) 8%,transparent);
  color:var(--foreground);
  padding:2px 7px;border-radius:6px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
#changelog-content a{color:var(--linkedin);text-decoration:none;font-weight:500}
#changelog-content a:hover{text-decoration:underline}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease-out,transform .7s ease-out}
.reveal.is-visible{opacity:1;transform:translateY(0)}
@media (max-width:640px){
  .container{padding:32px 22px}
  h1{font-size:24px}
  body{padding:32px 14px}
}
  </style>
</head>
<body>
  <div class="container reveal">
    <div class="header">
      <img src="https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/main/public/logo.png" class="logo" alt="LinkedIn to Sheets logo">
      <h1>LinkedIn to Sheets</h1>
    </div>
    <p style="margin-top:6px">Changelog &amp; release notes</p>
    <hr>

    <div id="changelog-content">Loading changelog…</div>

    <hr>

    <div class="buttons">
      <a class="btn" href="https://josueluna.github.io/LinkedIn_to_Sheets/wiki.html">Documentation</a>
      <a class="btn secondary" href="https://josueluna.github.io/LinkedIn_to_Sheets/privacy.html">Privacy Policy</a>
      <a class="btn secondary" href="https://forms.gle/xmCiUB8Tzs3ocM616" target="_blank" rel="noopener">Contact Support</a>
    </div>

    <div class="footer">© LinkedIn to Sheets</div>
  </div>

  <script>
    fetch("https://raw.githubusercontent.com/josueluna/LinkedIn_to_Sheets/refs/heads/develop/CHANGELOG.md")
      .then(r => r.text())
      .then(md => { document.getElementById("changelog-content").innerHTML = marked.parse(md); })
      .catch(err => { document.getElementById("changelog-content").innerHTML = "Error loading changelog."; console.error(err); });

    // Reveal on load
    requestAnimationFrame(() => {
      document.querySelectorAll(".reveal").forEach(el => el.classList.add("is-visible"));
    });
  </script>
</body>
</html>
